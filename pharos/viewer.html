<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pharos report</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg2: #f5f5f7;
        --panel: #ffffff;
        --border: #e5e5ea;
        --border2: #d2d2d7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --muted2: #86868b;
        --accent: #0071e3;
        --accent-bg: #e8f0fe;
        --sys: #8e8e93;
        --user: #007aff;
        --assistant: #af52de;
        --tool: #0e8f9d;
        --mark: #fff1a8;
        --sev1: #8e8e93;
        --sev3: #f5b800;
        --sev5: #ff9500;
        --sev7: #ff3b30;
        --sev9: #a30f0f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.05);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        background: var(--bg2);
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "SF Pro Display",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        position: relative;
        z-index: 3;
      }
      header h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 6px 0 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        margin-right: 4px;
        white-space: nowrap;
      }
      .pill b {
        color: var(--text);
        font-weight: 600;
      }
      button,
      select,
      input {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border2);
        border-radius: 7px;
        padding: 4px 9px;
        font: inherit;
        font-size: 12.5px;
        height: 28px;
      }
      input::placeholder {
        color: var(--muted2);
      }
      button {
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      select:focus,
      input:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
      }
      #instr {
        border-bottom: 1px solid var(--border);
        background: #fafafc;
        padding: 10px 20px;
        display: none;
        max-height: 40vh;
        overflow: auto;
      }
      #instr.open {
        display: block;
      }
      #instr .box {
        border: 1px solid #f2d59b;
        border-left: 4px solid #f5a623;
        background: #fffaf0;
        border-radius: 10px;
        padding: 12px 14px;
        margin: 6px 0;
      }
      #instr .box .lbl {
        color: #9a5b00;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 6px;
      }
      #instr pre {
        white-space: pre-wrap;
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #3a3a3c;
        font-family: inherit;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: var(--leftw, 34%) 6px 1fr;
        min-height: 0;
        background: var(--bg2);
      }
      #splitter {
        cursor: col-resize;
        background: transparent;
        position: relative;
      }
      #splitter::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 2px;
        width: 1px;
        background: var(--border);
      }
      #splitter:hover::before,
      #splitter.drag::before {
        width: 3px;
        left: 1px;
        background: var(--accent);
      }
      #splitter::after {
        content: "";
        position: absolute;
        top: 50%;
        left: -3px;
        width: 12px;
        height: 40px;
        margin-top: -20px;
      }
      body.dragging {
        cursor: col-resize;
        user-select: none;
      }
      #left {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        background: #fff;
      }
      #filters {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 12px;
        background: #fff;
      }
      #tablewrap {
        overflow: auto;
        flex: 1;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 12.5px;
        table-layout: fixed;
      }
      th,
      td {
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }
      td {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th {
        position: sticky;
        top: 0;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
        font-weight: 500;
        font-size: 11.5px;
        color: var(--muted);
        z-index: 1;
        box-shadow: inset 0 -1px 0 var(--border);
      }
      th .rz {
        position: absolute;
        top: 0;
        right: 0;
        width: 7px;
        height: 100%;
        cursor: col-resize;
      }
      th .rz:hover {
        background: var(--accent-bg);
        box-shadow: inset -2px 0 0 var(--accent);
      }
      tr.row {
        cursor: pointer;
        transition: background 0.08s;
      }
      tr.row:hover {
        background: var(--bg2);
      }
      tr.row.sel {
        background: var(--accent-bg);
      }
      tr.row.sel td:first-child {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      td.mono,
      .mono {
        font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      #colmenu {
        position: relative;
      }
      #colmenu summary {
        cursor: pointer;
        list-style: none;
        background: #fff;
        border: 1px solid var(--border2);
        border-radius: 7px;
        padding: 4px 9px;
        font-size: 12.5px;
        height: 28px;
        display: inline-flex;
        align-items: center;
      }
      #colmenu summary::-webkit-details-marker {
        display: none;
      }
      #colmenu summary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #colmenu-list {
        position: absolute;
        z-index: 5;
        top: 32px;
        left: 0;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 190px;
        box-shadow: var(--shadow);
      }
      #colmenu-list label {
        display: block;
        white-space: nowrap;
        padding: 2px 0;
        cursor: pointer;
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        letter-spacing: 0.01em;
      }
      .v-clean {
        background: #f2f2f7;
        color: #3a3a3c;
      }
      .v-minor {
        background: #fff4d6;
        color: #8a5a00;
      }
      .v-concerning {
        background: #ffe8d6;
        color: #9a3412;
      }
      .v-bad {
        background: #ffe0e0;
        color: #b3261e;
      }
      .v-critical {
        background: #c62828;
        color: #fff;
      }
      .v-none {
        background: #f2f2f7;
        color: #86868b;
      }
      .sev {
        display: inline-block;
        min-width: 24px;
        text-align: center;
        padding: 1px 6px;
        border-radius: 6px;
        font-weight: 600;
        color: #fff;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      .st-ok {
        color: #1a7f37;
      }
      .st-ok_with_warnings {
        color: #9a6700;
      }
      .st-failed {
        color: #d1242f;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
        margin: 1px 3px 1px 0;
        border: 1px solid var(--border2);
        background: #fff;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.1s,
          border-color 0.1s;
      }
      .chip.r-assistant {
        border-color: #d9b8f0;
        background: #faf3ff;
        color: #6b21a8;
      }
      .chip.r-tool {
        border-color: #a9dde3;
        background: #eefbfc;
        color: #0b6b76;
      }
      .chip.r-user {
        border-color: #b6d4ff;
        background: #eef5ff;
        color: #0b57d0;
      }
      .chip.r-system {
        border-color: var(--border2);
        background: #f5f5f7;
        color: #48484a;
      }
      .chip:hover {
        filter: brightness(0.96);
      }
      .agree-both_flag {
        color: #d1242f;
        font-weight: 600;
      }
      .agree-only_a {
        color: #9a6700;
        font-weight: 600;
      }
      .agree-only_b {
        color: #0969da;
        font-weight: 600;
      }
      .agree-neither {
        color: var(--muted2);
      }
      #right {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        background: var(--bg2);
      }
      #insp-head {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: #fff;
      }
      #insp-body {
        overflow: auto;
        flex: 1;
        padding: 14px 20px 40px;
      }
      .section {
        margin-bottom: 18px;
      }
      .section h2 {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .finding {
        border: 1px solid var(--border);
        border-left: 4px solid var(--sev5);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 8px 0;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .finding .top {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .finding .cat {
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: -0.005em;
      }
      .finding p {
        margin: 6px 0;
        white-space: pre-wrap;
        color: #2c2c2e;
      }
      .finding .lim {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .finding .warn {
        color: #9a6700;
        font-size: 12px;
        background: #fff8e6;
        border-radius: 6px;
        padding: 2px 8px;
        display: inline-block;
        margin-top: 4px;
      }
      .runtag {
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 5px;
        background: #eef5ff;
        color: #0b57d0;
        border: 1px solid #cfe1ff;
        font-weight: 600;
      }
      .runtag.b {
        background: #ecfbf3;
        color: #0f6d3a;
        border-color: #b8ebd0;
      }
      .msg {
        border: 1px solid var(--border);
        border-left: 3px solid var(--sys);
        border-radius: 10px;
        margin: 8px 0;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .msg.r-user {
        border-left-color: var(--user);
      }
      .msg.r-assistant {
        border-left-color: var(--assistant);
      }
      .msg.r-tool {
        border-left-color: var(--tool);
      }
      .msg.cited {
        box-shadow:
          0 0 0 2px rgba(255, 149, 0, 0.55),
          var(--shadow);
      }
      .msg.flash {
        animation: fl 1.2s;
      }
      @keyframes fl {
        0% {
          background: #fff3cd;
        }
        100% {
          background: #fff;
        }
      }
      .msg .mh {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--muted);
        flex-wrap: wrap;
        background: #fafafc;
        border-radius: 10px 10px 0 0;
      }
      .msg .mh .idx {
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        color: var(--text);
        font-weight: 600;
      }
      .role {
        padding: 1px 7px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 0.02em;
      }
      .role.r-system {
        background: #f2f2f7;
        color: #48484a;
      }
      .role.r-user {
        background: #e5f0ff;
        color: #0b57d0;
      }
      .role.r-assistant {
        background: #f6ecff;
        color: #6b21a8;
      }
      .role.r-tool {
        background: #e3f6f8;
        color: #0b6b76;
      }
      .origin {
        font-style: normal;
        color: var(--muted2);
      }
      .midusr {
        background: #0b57d0;
        color: #fff;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
      }
      .msg pre {
        margin: 0;
        padding: 10px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.55;
        color: #1d1d1f;
        max-height: none;
      }
      .msg.collapsed pre {
        max-height: 180px;
        overflow: hidden;
        position: relative;
        -webkit-mask-image: linear-gradient(#000 70%, transparent);
        mask-image: linear-gradient(#000 70%, transparent);
      }
      .msg .more {
        padding: 6px 12px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--accent);
        cursor: pointer;
        background: #fff;
        border-radius: 0 0 10px 10px;
      }
      .msg .more:hover {
        background: var(--accent-bg);
      }
      mark {
        background: var(--mark);
        color: #1d1d1f;
        padding: 0 2px;
        border-radius: 3px;
        box-shadow: 0 0 0 1px #f2dc7a;
      }
      mark.notfound {
        background: #ffd6d6;
      }
      #ctx {
        border: 1px solid #f2d59b;
        border-radius: 12px;
        padding: 12px;
        background: #fffaf0;
        display: none;
        box-shadow: var(--shadow);
      }
      #ctx.open {
        display: block;
      }
      #ctx .ctl {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      #ctx .ctl input {
        width: 56px;
      }
      .kbd {
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        background: #f5f5f7;
        border: 1px solid var(--border2);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 0 5px;
        font-size: 10.5px;
        color: #3a3a3c;
      }
      .muted {
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin: 6px 0;
      }
      .tabs button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      #raw pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        background: #fff;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #3a3a3c;
      }
      .summary {
        color: #3a3a3c;
      }
      .empty {
        color: var(--muted);
        padding: 40px 20px;
        text-align: center;
      }
      td.cats {
        font-size: 11.5px;
        color: #3a3a3c;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c7c7cc;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aeaeb2;
        background-clip: padding-box;
        border: 2px solid transparent;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pharos</h1>
      <span id="runinfo"></span>
      <button id="btn-instr">Monitor instructions</button>
      <span class="muted"
        ><span class="kbd">j</span>/<span class="kbd">k</span> next/prev trajectory ·
        <span class="kbd">n</span>/<span class="kbd">p</span> next/prev evidence ·
        <span class="kbd">e</span> expand all</span
      >
    </header>
    <div id="instr"></div>
    <main>
      <section id="left">
        <div id="filters">
          <input id="q" placeholder="search id / repo / summary / behavior" size="28" />
          <select id="f-verdict">
            <option value="">verdict ≥ any</option>
            <option value="minor">≥ minor</option>
            <option value="concerning" selected>≥ concerning</option>
            <option value="bad">≥ bad</option>
            <option value="critical">critical</option>
          </select>
          <select id="f-cat">
            <option value="">any category</option>
          </select>
          <select id="f-status">
            <option value="">any status</option>
            <option value="ok">ok</option>
            <option value="ok_with_warnings">ok_with_warnings</option>
            <option value="failed">failed*</option>
          </select>
          <select id="f-agree" style="display: none">
            <option value="">any agreement</option>
            <option value="both_flag">both flag</option>
            <option value="only_a">only A</option>
            <option value="only_b">only B</option>
            <option value="neither">neither</option>
          </select>
          <details id="colmenu">
            <summary>columns ▾</summary>
            <div id="colmenu-list"></div>
          </details>
          <span id="count" class="muted"></span>
        </div>
        <div id="tablewrap">
          <table id="tbl">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <div id="splitter" title="drag to resize"></div>
      <section id="right">
        <div id="insp-head"><span class="muted">Select a trajectory</span></div>
        <div id="insp-body">
          <div class="empty">Findings, evidence context and the full transcript appear here.</div>
        </div>
      </section>
    </main>
    <script src="data/runs.js"></script>
    <script>
      (function () {
        const D = window.__RUNS__;
        const RUNS = D.runs;
        const CMP = D.compare;
        const IDX = D.traj_index;
        const VR = { clean: 0, minor: 1, concerning: 2, bad: 3, critical: 4 };
        const $ = (s) => document.querySelector(s);
        function el(tag, attrs, ...kids) {
          const e = document.createElement(tag);
          if (attrs)
            for (const [k, v] of Object.entries(attrs)) {
              if (k === "class") e.className = v;
              else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
              else e.setAttribute(k, v);
            }
          for (const k of kids) {
            if (k == null) continue;
            e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
          }
          return e;
        }
        function sevColor(s) {
          return s >= 9
            ? "var(--sev9)"
            : s >= 7
              ? "var(--sev7)"
              : s >= 5
                ? "var(--sev5)"
                : s >= 3
                  ? "var(--sev3)"
                  : "var(--sev1)";
        }
        function sevEl(s) {
          s = s || 0;
          return el(
            "span",
            {
              class: "sev",
              style: "background:" + sevColor(s) + (s >= 3 && s <= 4 ? ";color:#1d1d1f" : ""),
            },
            String(s),
          );
        }
        function vEl(v) {
          return el("span", { class: "badge v-" + (v || "none") }, v || "n/a");
        }
        function stEl(s) {
          s = s || "";
          return el(
            "span",
            { class: "mono " + (s.startsWith("failed") ? "st-failed" : "st-" + s) },
            s,
          );
        }

        // ---- header
        const ri = $("#runinfo");
        RUNS.forEach((r, i) => {
          const m = r.manifest || {};
          const res = Object.values(r.results);
          const vc = {};
          res.forEach((x) => {
            vc[x.verdict || "none"] = (vc[x.verdict || "none"] || 0) + 1;
          });
          const fails = res.filter((x) => !(x.execution_status || "").startsWith("ok")).length;
          const cov = res.filter(
            (x) => x.review_coverage && x.review_coverage.mode !== "full",
          ).length;
          ri.appendChild(
            el(
              "span",
              { class: "pill" },
              el("span", { class: "runtag" + (i ? " b" : "") }, i ? "B" : "A"),
              " ",
              el("b", null, r.run_id),
              " · ",

        function highlighted(text, quotes) {
          // returns a DocumentFragment; quotes: [{q,found}]
          const frag = document.createDocumentFragment();
          const qs = (quotes || []).filter((x) => x.q && x.found !== false).map((x) => x.q);
          if (!qs.length) {
            frag.appendChild(document.createTextNode(text));
            return frag;
          }
          let pos = 0;
          const spans = [];
          qs.forEach((q) => {
            let at = text.indexOf(q);
            if (at < 0) {
              const nq = q.replace(/\s+/g, " ").trim();
              /* whitespace-normalised fallback: approximate by first 24 chars */ at = text.indexOf(
                nq.slice(0, 24),
              );
              if (at >= 0) spans.push([at, Math.min(text.length, at + nq.length)]);
            } else spans.push([at, at + q.length]);
          });
          spans.sort((a, b) => a[0] - b[0]);
          const merged = [];
          spans.forEach((s) => {
            if (merged.length && s[0] <= merged[merged.length - 1][1])
              merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], s[1]);
            else merged.push(s.slice());
          });
          merged.forEach(([a, b]) => {
            if (a > pos) frag.appendChild(document.createTextNode(text.slice(pos, a)));
            frag.appendChild(el("mark", null, text.slice(a, b)));
            pos = b;
          });
          if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
          return frag;
        }

              "button",
              {
                onclick: () => {
                  const x = document.getElementById("m-" + ev.index);
                  if (x) {
                    x.scrollIntoView({ block: "center" });
                    x.classList.remove("flash");
                    void x.offsetWidth;
                    x.classList.add("flash");
                  }
                },
              },
              "jump in transcript",
            ),
            el("button", { onclick: () => ctx.classList.remove("open") }, "close"),
            el(
              "span",
              { class: "muted" },
              "Read top-to-bottom: what was authorized (user), what the agent said (assistant), what actually happened (tool), and what followed.",
            ),
          );
          ctx.appendChild(ctl);
          const r = RUNS[ev.run].results[t.id];
          const f = r.findings[ev.fi];
          const qmap = new Map();
          f.evidence.forEach((e) =>
            qmap.set(
              e.index,
              (e.quotes || []).map((q) => ({ q: q.quote, found: q.found })),
            ),
          );
          const lo = Math.max(0, ev.index - K),
            hi = Math.min(t.messages.length - 1, ev.index + K);
          const saved = expandAll;
          expandAll = true;
          for (let i = lo; i <= hi; i++) {
            const m = t.messages[i];
            const e = msgEl(t, m, qmap.get(m.index) || null, qmap.has(m.index), i);
            e.id = "ctx-m-" + m.index;
            if (m.index === ev.index) e.style.outline = "3px solid #f59e0b";
            ctx.appendChild(e);
          }
          expandAll = saved;
          ctx.scrollIntoView({ block: "start" });
        }
        document.addEventListener("keydown", (ev) => {
          if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
          const i = filtered.findIndex((r) => r.id === selected);
          if (ev.key === "j") {
            const n = filtered[Math.min(filtered.length - 1, i + 1)];
            if (n) select(n.id);
          } else if (ev.key === "k") {
            const n = filtered[Math.max(0, i - 1)];
            if (n) select(n.id);
          } else if (ev.key === "n") {
            showEvidence(evPos + 1);
          } else if (ev.key === "p") {
            showEvidence(evPos - 1);
          } else if (ev.key === "e") {
            expandAll = !expandAll;
            if (curTraj) renderInspector();
          }
        });
        // ---- resizable split (drag the bar; width remembered per browser)
        (function () {
          const sp = $("#splitter");
          const main = document.querySelector("main");
          let saved = null;
          try {
            saved = localStorage.getItem("monitor.leftw");
          } catch (e) {}
          if (saved) main.style.setProperty("--leftw", saved);
          let dragging = false;
          sp.addEventListener("mousedown", (e) => {
            dragging = true;
            sp.classList.add("drag");
            document.body.classList.add("dragging");
            e.preventDefault();
          });
          window.addEventListener("mousemove", (e) => {
            if (!dragging) return;
            const r = main.getBoundingClientRect();
            const px = Math.min(Math.max(e.clientX - r.left, 260), r.width - 360);
            main.style.setProperty("--leftw", px + "px");
          });
          window.addEventListener("mouseup", () => {
            if (!dragging) return;
            dragging = false;
            sp.classList.remove("drag");
            document.body.classList.remove("dragging");
            try {
              localStorage.setItem("monitor.leftw", main.style.getPropertyValue("--leftw"));
            } catch (e) {}
          });
          sp.addEventListener("dblclick", () => {
            main.style.removeProperty("--leftw");
            try {
              localStorage.removeItem("monitor.leftw");
            } catch (e) {}
          });
        })();
        applyFilters();
        if (filtered.length) select(filtered[0].id);
      })();
    </script>
  </body>
</html>
