[project]
name = "pharos"
version = "0.1.0"
description = "Run natural-language monitors over coding-agent trajectories, verify every cited piece of evidence against the log, and adjudicate the results in a viewer."
readme = "README.md"
requires-python = ">=3.11"
# The core pipeline is standard-library only. Provider SDKs are optional extras
# so a regex-only or CLI-backed deployment never pulls them in.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.50"]

[project.scripts]
pharos = "pharos.cli:main"

[dependency-groups]
dev = [
  "isort>=5.13",
  "mypy>=1.13",
  "pyink>=24.10",
  "pylint>=3.3",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos"]

# ---------------------------------------------------------------------------
# Style: Google Python style as practised in google3 (2-space indentation,
# 80 columns, module imports, Google docstrings). pyink is Google's fork of
# black that encodes those conventions.
# ---------------------------------------------------------------------------
[tool.pyink]
line-length = 80
target-version = ["py311"]
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.isort]
profile = "google"
line_length = 80
known_first_party = ["pharos"]

[tool.mypy]
python_version = "3.11"
packages = ["pharos"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
